{% extends "base.html" %}
{% block title %}Set up Admin · StudentDesk{% endblock %}
{% block content %}
<section class="auth-card">
  <p class="eyebrow">FIRST-TIME SETUP</p>
  <h1>Create Admin Account</h1>
  <p class="muted">Create the first admin login. Choose a 6-digit password using numbers 0-9.</p>
  {% if error %}<p class="notice error">{{ error }}</p>{% endif %}
  <form method="post" action="/setup/admin" class="auth-form">
    <label>Admin username<input name="username" required minlength="3" maxlength="100" autocomplete="username"></label>
    <label>Password<input name="password" type="password" required minlength="6" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" autocomplete="new-password"></label>
    <label>Confirm password<input name="confirm_password" type="password" required minlength="6" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" autocomplete="new-password"></label>
    <button class="button primary" type="submit">Create Admin Account</button>
  </form>
</section>
{% endblock %}
