{% extends "base.html" %}
{% block title %}Set Student Password · StudentDesk{% endblock %}
{% block content %}
<section class="auth-card">
  <p class="eyebrow">ACCOUNT APPROVED</p>
  <h1>Set your password</h1>
  <p class="muted">Choose a 4-digit password using numbers 0-9. This setup link can only be used once.</p>
  {% if error %}<p class="notice error">{{ error }}</p>{% endif %}
  <form method="post" action="/student/setup-password" class="auth-form">
    <input type="hidden" name="token" value="{{ token }}">
    <label>Password<input name="password" type="password" required minlength="4" maxlength="4" pattern="[0-9]{4}" inputmode="numeric" autocomplete="new-password"></label>
    <label>Confirm password<input name="confirm_password" type="password" required minlength="4" maxlength="4" pattern="[0-9]{4}" inputmode="numeric" autocomplete="new-password"></label>
    <button class="button primary" type="submit">Set password and continue</button>
  </form>
</section>
{% endblock %}
